<script type="module">
    import { Controller } from "downflow"

    application.context = {
        ...application.context,
        count: 0
    }

    function increment() {
        application.context.count++
    }

    function decrement() {
        application.context.count--
    }

    class CounterController extends Controller {
        static controllerName = "counter"

        increment () {
            increment()
        }
        decrement () {
            decrement()
        }
    }

    application.register(CounterController)
</script>
