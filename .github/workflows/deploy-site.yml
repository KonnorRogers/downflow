name: Deploy Site

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  push:
    branches:
      - main # deploy main. If your branch is `master`, you'll have to replace that throughout this file.
  pull_request: # This will publish a site preview on every pull request, and also run the build command to test if the site is broken.
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      attestations: none
      checks: write
      contents: write
      deployments: write
      id-token: write
      issues: write
      discussions: none
      packages: none
      pages: none
      pull-requests: write
      repository-projects: none
      security-events: none
      statuses: read

    strategy:
      matrix:
        node-version: [24]
    env:
      PR_PATH: pull/${{github.event.number}}
    steps:
      - name: Comment on PR
        uses: hasura/comment-progress@v2.2.0
        if: github.ref != 'refs/heads/main'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "Starting deployment of preview ⏳..."

      # 7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compute base path
        # DOMAIN uses the repo owner, not the actor, so a PR from a fork still
        # points at konnorrogers.github.io instead of the contributor's own pages.
        # BASE_PATH is what the site is actually served under: /downflow for a
        # production deploy, /downflow/pull/<number> for a PR preview.
        run: |
          DOMAIN="${{ github.repository_owner }}.github.io"
          BASE_PATH="/${{ github.event.repository.name }}"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            BASE_PATH="$BASE_PATH/${{ env.PR_PATH }}"
          fi
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          echo "BASE_PATH=$BASE_PATH" >> $GITHUB_ENV
          echo "URL=https://$DOMAIN$BASE_PATH/" >> $GITHUB_ENV

      - name: Build website
        run: |
          npm run build
          npm run build:docs -- --pathprefix="$BASE_PATH/"

      - name: Set username + email
        run: |
          git config --global user.email "support+actions@github.com"
          git config --global user.name "github-actions-bot"

      - name: Deploy with gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages --remove "{!(pull),!(pull)/**}" -d ./_site --dotfiles --nojekyll -b gh-pages -u "github-actions-bot <support+actions@github.com>"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview with gh-pages
        if: github.ref != 'refs/heads/main'
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages -d ./_site --dotfiles --nojekyll --dest "${{ env.PR_PATH }}" -b gh-pages -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment
        uses: hasura/comment-progress@v2.2.0
        if: github.ref != 'refs/heads/main'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "A preview of ${{ github.event.after }} is uploaded and can be seen here:\n\n ✨ ${{ env.URL }} ✨\n\nChanges may take a few minutes to propagate. Since this is a preview of production, content with `draft: true` will not be rendered. The source is here: https://github.com/${{ github.repository }}/tree/gh-pages/${{ env.PR_PATH }}/"

